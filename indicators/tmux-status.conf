# Karabiner mode readout for the tmux status bar.
# Append to ~/.tmux.conf (or adapt into your existing status-right).
# Modes are flag files written by switchMode() in utils.ts; switching modes
# runs `tmux refresh-client -S`, so the readout updates instantly.

# Right: git branch | karabiner mode | vim mode | path
set -g status-right-length 120
set -g status-right "#(\
  branch=\$(git -C #{pane_current_path} --no-optional-locks symbolic-ref --short HEAD 2>/dev/null); \
  kb=Normal; \
  [ -f /tmp/karabiner_mode_programming ] && kb=Programming; \
  [ -f /tmp/karabiner_mode_reading ] && kb=Reading; \
  [ -f /tmp/karabiner_mode_trivia ] && kb=Trivia; \
  path=\$(echo #{pane_current_path} | sed \"s|$HOME|~|\"); \
  sep='#[fg=#45475a] | '; \
  out=''; \
  [ -n \"\$branch\" ] && out=\"#[fg=#89dceb]git:\$branch\"; \
  [ -n \"\$kb\" ] && out=\"\$out\${sep}#[fg=#f9e2af]KB:\$kb\"; \
  [ -f /tmp/karabiner_mode_vim_mode ] && out=\"\$out\${sep}#[fg=#f38ba8,bold]VIM\"; \
  out=\"\$out\${sep}#[fg=#f8f8f2]\$path\"; \
  echo \"\$out\"\
) "

# Clear karabiner mode flags on startup (variables reset but files persist)
run-shell "rm -f /tmp/karabiner_mode_*"
